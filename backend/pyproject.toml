[project]
name = "mirsad"
version = "0.1.0"
description = "Mirsad — weekly branch-export ingestion that is honest about its own gaps"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",  # Tulkarem's hand-typed Word tables — DECISIONS.md D-003
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
